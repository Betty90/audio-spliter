appId: com.uaudiolab.app
productName: UAudioLab
copyright: Copyright © 2025 UAudioLab
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - electron/dist/**/*
  - electron/preload.js
  - package.json
extraResources:
  - from: resources/server
    to: server
    filter:
      - "**/*"
# macOS Configuration
mac:
  category: public.app-category.music
  icon: assets/icons/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  darkModeSupport: true
# macOS DMG
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  backgroundColor: "#1a1a1a"
# Windows Configuration
win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
# Windows NSIS Installer
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: UAudioLab
  include: assets/nsis/installer.nsh
  artifactName: "${productName}-${version}-Setup.${ext}"
# Linux Configuration
linux:
  icon: assets/icons/icon.png
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: UAudioLab Team
  synopsis: Intelligent Audio Slicing and Speaker Diarization Tool
  description: |
    UAudioLab is an intelligent audio slicing and speaker diarization tool
    based on machine learning algorithms. It automatically identifies different
    speakers in audio files and supports visual editing and segment export.
  mimeTypes:
    - audio/mpeg
    - audio/wav
    - audio/x-wav
    - audio/mp4
    - audio/x-m4a
    - audio/ogg
    - audio/aac
  desktop:
    Name: UAudioLab
    Comment: Intelligent Audio Slicing Tool
    Categories: AudioVideo;Audio;
    MimeType: audio/mpeg;audio/wav;audio/x-wav;audio/mp4;audio/x-m4a;
# DEB specific
deb:
  priority: optional
# Publish Configuration (GitHub Releases)
publish:
  provider: github
  owner: Betty90
  repo: audio-spliter
  releaseType: release
# Compression
compression: maximum
asar: true
asarUnpack:
  - "**/*.node"
