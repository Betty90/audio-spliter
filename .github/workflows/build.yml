name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install ffmpeg

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Remove package-lock.json (fix cross-platform deps)
        shell: bash
        run: rm -f package-lock.json

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install flask librosa numpy scikit-learn soundfile scipy audioread

      - name: Build frontend and Electron
        run: |
          npm run build
          npm run electron:build

      - name: Build Python backend (Unix)
        if: matrix.platform != 'win'
        run: |
          chmod +x scripts/build-python.sh
          ./scripts/build-python.sh

      - name: Copy Python backend to resources (Unix)
        if: matrix.platform != 'win'
        run: |
          echo "Creating resources/server directory..."
          mkdir -p resources/server
          echo "Checking for PyInstaller output..."
          if [ -d "py-dist/server" ]; then
            echo "✓ Found py-dist/server, copying to resources/server/..."
            cp -r py-dist/server/* resources/server/
          elif [ -d "backend/dist/server" ]; then
            echo "✓ Found backend/dist/server, copying to resources/server/..."
            cp -r backend/dist/server/* resources/server/
          elif [ -d "dist/server" ]; then
            echo "✓ Found dist/server, copying to resources/server/..."
            cp -r dist/server/* resources/server/
          else
            echo "⚠ Warning: No PyInstaller output found"
            echo "Listing py-dist contents:"
            ls -la py-dist/ 2>/dev/null || echo "py-dist does not exist"
            echo "Listing backend/dist contents:"
            ls -la backend/dist/ 2>/dev/null || echo "backend/dist does not exist"
            echo "Listing dist contents:"
            ls -la dist/ 2>/dev/null || echo "dist does not exist"
            exit 1
          fi
          echo "Final contents of resources/server:"
          ls -la resources/server/ 2>/dev/null || echo "resources/server is empty"

      - name: Build Python backend (Windows)
        if: matrix.platform == 'win'
        run: |
          pip install pyinstaller
          cd backend
          pyinstaller server.spec --clean --noconfirm
          cd ..
          echo "Creating resources directory..."
          if not exist resources mkdir resources
          echo "Checking for PyInstaller output..."
          if exist py-dist\server (
            echo "✓ Found py-dist\server, copying to resources\server\..."
            xcopy /E /I /Y py-dist\server resources\server
          ) else if exist backend\dist\server (
            echo "✓ Found backend\dist\server, copying to resources\server\..."
            xcopy /E /I /Y backend\dist\server resources\server
          ) else if exist dist\server (
            echo "✓ Found dist\server, copying to resources\server\..."
            xcopy /E /I /Y dist\server resources\server
          ) else (
            echo "⚠ Warning: No PyInstaller output found"
            exit /b 1
          )
          echo "Final contents of resources\server:"
          dir resources\server /s /b 2>nul || echo "resources\server is empty or does not exist"
          echo "Testing server.exe startup..."
          start /B resources\server\server.exe --port 9999 > server_test.log 2>&1
          powershell -NoProfile -Command "$deadline = (Get-Date).AddSeconds(30); do { Start-Sleep -Seconds 2; try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:9999/health' -TimeoutSec 5; if ($r.status -eq 'ok') { exit 0 } } catch { Write-Host ('Waiting for server: ' + $_.Exception.Message) } } while ((Get-Date) -lt $deadline); Write-Error 'server.exe did not become healthy'; exit 1"
          powershell -NoProfile -Command "$debug = Invoke-RestMethod -Uri 'http://127.0.0.1:9999/debug' -TimeoutSec 5; Write-Host ('FFmpeg binary: ' + $debug.ffmpeg_binary); if ($debug.ffmpeg_binary -eq 'ffmpeg' -or -not (Test-Path $debug.ffmpeg_binary)) { Write-Error ('Bundled FFmpeg is not available: ' + $debug.ffmpeg_binary); exit 1 }"
          if errorlevel 1 (
            type server_test.log
            taskkill /F /IM server.exe 2>nul || echo "Server process not found or already stopped"
            exit /b 1
          )
          type server_test.log
          taskkill /F /IM server.exe 2>nul || echo "Server process not found or already stopped"
        shell: cmd

      - name: Build and package (macOS)
        if: matrix.platform == 'mac'
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
            npm run electron:pack -- --mac --publish always
          else
            npm run electron:pack -- --mac --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build and package (Windows)
        if: matrix.platform == 'win'
        run: |
          if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") {
            npm run electron:pack -- --win --publish always
          } else {
            npm run electron:pack -- --win --publish never
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and package (Linux)
        if: matrix.platform == 'linux'
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
            npm run electron:pack -- --linux --publish always
          else
            npm run electron:pack -- --linux --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Build Success Notification
        run: |
          echo "✅ Build completed successfully!"
          echo "Platform builds: ${{ needs.build.result }}"
