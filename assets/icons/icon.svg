<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Audio Waveform -->
  <g transform="translate(256, 256)" fill="none" stroke="white" stroke-width="12" stroke-linecap="round">
    <!-- Left waves -->
    <path d="M-120 -60 L-120 60" opacity="0.4"/>
    <path d="M-90 -90 L-90 90" opacity="0.6"/>
    <path d="M-60 -120 L-60 120" opacity="0.8"/>
    
    <!-- Center waves -->
    <path d="M-20 -150 L-20 150" opacity="1"/>
    <path d="M20 -150 L20 150" opacity="1"/>
    
    <!-- Right waves -->
    <path d="M60 -120 L60 120" opacity="0.8"/>
    <path d="M90 -90 L90 90" opacity="0.6"/>
    <path d="M120 -60 L120 60" opacity="0.4"/>
  </g>
  
  <!-- AS Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">AS</text>
</svg>
